# Where the picture waits for the voice (docs/video/cut.py --dialogue).
#
# For each line of docs/video/script-v2.md: the words that must land on a moment in the picture. A mark is
# CLIP:LABEL from the recorder's marks.json; LABEL#N is its Nth occurrence (caption#2 is the clip's second caption).
# The first mark in the list that the take has is used, so take 4's own marks come first and take 3's stand-ins
# after them. The picture shows the moment just before the word is said: it holds (or keeps more of a wait) when it
# is early, and the voice pauses between lines (or at a / inside one) when the picture is late. 6m is Hafiz's
# MetaMask clip, whose moments come from --metamask-mark.

"00.1": [{cue: Families, mark: [ch1:start]}]
"00.2": [{cue: left, mark: [ch1:left-begin, "ch1:caption#2"]},
         {cue: right, mark: [ch1:right-begin, "ch1:caption#3"]}]
"01.1": [{cue: Banks, mark: [ch2:start]}]
"01.2": [{cue: Trustees, mark: [ch2:mandate, "ch2:caption#3"]}]
