[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]
# Tests read the EIP-712 vectors and fixture data; scripts write deployments.
fs_permissions = [
    { access = "read-write", path = "../shared" },
    { access = "read-write", path = "./deployments" },
    { access = "read", path = "../redteam/data" },
    { access = "read", path = "./test/fixtures" },
    { access = "read-write", path = "./cache" },
]

[fuzz]
runs = 256

[invariant]
runs = 256
depth = 64
fail_on_revert = false

[lint]
# Deadlines, cooling-off, mandate expiry and the day and period windows last minutes to days.
# A sequencer can shift a timestamp by seconds, which none of these checks depend on.
exclude_lints = ["block-timestamp"]

[rpc_endpoints]
base_sepolia = "${RPC_URL}"
anvil = "http://127.0.0.1:8545"

# Etherscan's API serves Base Sepolia to paid plans only, so the deploys verify on Blockscout, which needs no key
# (decision A-13): forge script ... --broadcast --verify --verifier blockscout --verifier-url "$VERIFIER_URL".
# A paid Etherscan key could add Basescan: forge verify-contract ... --chain 84532 --etherscan-api-key "$BASESCAN_API_KEY".
