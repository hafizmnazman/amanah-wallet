[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]
# Tests read the EIP-712 vectors and fixture data; scripts write deployments.
fs_permissions = [
    { access = "read-write", path = "../shared" },
    { access = "read-write", path = "./deployments" },
    { access = "read", path = "../redteam/data" },
    { access = "read", path = "./test/fixtures" },
]

[fuzz]
runs = 256

[invariant]
runs = 256
depth = 64
fail_on_revert = false
